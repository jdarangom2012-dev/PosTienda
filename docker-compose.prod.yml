services:
  backend:
    build: ./backend
    container_name: posfacil_backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      DB_NAME: postenda_qa
      DB_USER: postienda
      DB_PASSWORD: "12345"
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      ALLOWED_HOSTS: "52.165.89.25,localhost,127.0.0.1"
      SECRET_KEY: django-prod-clave-muy-segura-generar-con-python
      CREDITO_TOPE_MAXIMO: "10000000000"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - posfacil_net

  frontend:
    build: ./frontend
    container_name: posfacil_frontend
    ports:
      - "8081:80"

networks:
  posfacil_net:
    driver: bridge