services:
  db:
    image: postgres:16
    container_name: posfacil_db
    environment:
      POSTGRES_DB: postenda_qa
      POSTGRES_USER: postienda
      POSTGRES_PASSWORD: "12345"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postienda -d postenda_qa"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: posfacil_backend
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: posfacil_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: