<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Logo PosFácil</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@900&family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0d0a1f; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 40px; font-family: Arial, sans-serif; }

  .logo-wrapper {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 48px 64px;
    background: #0d0a1f;
    border-radius: 24px;
  }

  .icon-box {
    width: 100px;
    height: 100px;
    border-radius: 24px;
    background: linear-gradient(135deg, #6d28d9, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 40px rgba(124,58,237,0.45);
    flex-shrink: 0;
    position: relative;
  }

  .icon-dot {
    position: absolute;
    top: -6px; right: -6px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #06b6d4;
    border: 2px solid #0d0a1f;
  }

  .text-wrap { display: flex; flex-direction: column; gap: 6px; }

  .logo-name {
    font-family: 'Syne', 'Arial Black', sans-serif;
    font-weight: 900;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -2px;
    color: #ffffff;
  }

  .logo-name span {
    background: linear-gradient(135deg, #a855f7, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-tag {
    font-family: 'DM Sans', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #c4b5fd;
    text-transform: uppercase;
  }

  .accent-line {
    width: 40px; height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #7c3aed, #06b6d4);
    margin-top: 2px;
  }

  /* Versión fondo blanco */
  .logo-wrapper-light {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 48px 64px;
    background: #ffffff;
    border-radius: 24px;
  }

  .logo-name-dark {
    font-family: 'Syne', 'Arial Black', sans-serif;
    font-weight: 900;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -2px;
    color: #1a0a3c;
  }

  .logo-name-dark span {
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-tag-dark {
    font-family: 'DM Sans', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #7c3aed;
    text-transform: uppercase;
  }

  .label {
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .btn {
    padding: 12px 28px;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  .btn:hover { opacity: 0.9; }

  .instructions {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    text-align: center;
    line-height: 1.8;
    max-width: 500px;
  }
</style>
</head>
<body>

<p class="label">Versión oscura</p>

<div class="logo-wrapper" id="logo-dark">
  <div class="icon-box">
    <div class="icon-dot"></div>
    <svg width="54" height="54" viewBox="0 0 54 54" fill="none">
      <rect x="10" y="22" width="34" height="26" rx="5" stroke="white" stroke-width="3" stroke-linejoin="round"/>
      <path d="M16 22 C16 12, 38 12, 38 22" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
  <div class="text-wrap">
    <div class="logo-name">Pos<span>Fácil</span></div>
    <div class="logo-tag">Sistema de Punto de Venta</div>
    <div class="accent-line"></div>
  </div>
</div>

<p class="label" style="margin-top:16px;">Versión clara</p>

<div class="logo-wrapper-light" id="logo-light">
  <div class="icon-box">
    <div class="icon-dot"></div>
    <svg width="54" height="54" viewBox="0 0 54 54" fill="none">
      <rect x="10" y="22" width="34" height="26" rx="5" stroke="white" stroke-width="3" stroke-linejoin="round"/>
      <path d="M16 22 C16 12, 38 12, 38 22" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
  <div class="text-wrap">
    <div class="logo-name-dark">Pos<span>Fácil</span></div>
    <div class="logo-tag-dark">Sistema de Punto de Venta</div>
    <div class="accent-line"></div>
  </div>
</div>

<div class="instructions">
  Para guardar como imagen:<br>
  <strong style="color:white;">Clic derecho sobre el logo → "Guardar imagen como"</strong><br>
  O usa la tecla <strong style="color:white;">Impr Pant</strong> y recorta con Paint / Snipping Tool
</div>

</body>
</html>
