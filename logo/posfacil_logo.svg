<circle cx="99" cy="243" r="4" fill="#06b6d4" style="fill:rgb(6, 182, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Nombre versión clara -->
<text x="116" y="284" style="font-size:30px;letter-spacing:-0.5px;;fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Syne, &quot;Arial Black&quot;, sans-serif;font-size:30px;font-weight:900;text-anchor:start;dominant-baseline:auto">Pos<tspan fill="url(#accentGrad)" style="stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Syne, &quot;Arial Black&quot;, sans-serif;font-size:30px;font-weight:900;text-anchor:start;dominant-baseline:auto">Fácil</tspan></text>
<text x="116" y="298" style="font-size:10px;letter-spacing:0.15em;;fill:rgb(196, 181, 253);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;DM Sans&quot;, Arial, sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">SISTEMA DE PUNTO DE VENTA</text>

<text x="640" y="270" text-anchor="end" style="font-family:Arial;font-size:11px;fill:#6b7280;;fill:rgb(107, 114, 128);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">versión sobre fondo oscuro →</text>

