<!-- SEPARADOR                              -->
<!-- ═══════════════════════════════════════ -->
<line x1="40" y1="228" x2="640" y2="228" stroke="#e5e7eb" stroke-width="0.5" stroke-dasharray="4 4" mask="url(#imagine-text-gaps-wfdvpk)" style="fill:rgb(0, 0, 0);stroke:rgb(229, 231, 235);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-dasharray:4px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="340" y="224" text-anchor="middle" style="font-family:Arial;font-size:11px;fill:#9ca3af;;fill:rgb(156, 163, 175);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">versión sobre fondo oscuro</text>


